<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${student.id == null ? 'Thêm Sinh viên' : 'Sửa Sinh viên'}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h2 {
            font-weight: 700;
            color: #2c3e50;
            font-size: 1.8rem;
            margin: 0 0 10px 0;
        }

        .form-header p {
            color: #666;
            font-size: 0.95rem;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #34495e;
            margin-bottom: 8px;
            display: block;
            font-size: 0.95rem;
        }

        .form-label i {
            color: #667eea;
            margin-right: 5px;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        .form-control::placeholder {
            color: #bbb;
        }

        .form-hint {
            font-size: 0.85rem;
            color: #999;
            margin-top: 5px;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-submit, .btn-cancel {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            color: white;
            text-decoration: none;
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #333;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
            text-decoration: none;
        }

        .alert {
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
            padding: 12px 16px;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-danger {
            background: linear-gradient(135deg, #f5576c 0%, #ff9a56 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.2);
        }

        .alert-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.2);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #667eea;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #764ba2;
        }

        .gender-options {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .gender-option {
            flex: 1;
        }

        .gender-option input[type="radio"] {
            display: none;
        }

        .gender-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            margin: 0;
        }

        .gender-option input[type="radio"]:checked + label {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        @media (max-width: 576px) {
            .form-container {
                padding: 30px 20px;
            }

            .form-header h2 {
                font-size: 1.5rem;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn-submit, .btn-cancel {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="form-container">
        <!-- BACK LINK -->
        <a th:href="@{/students}" class="back-link">
            <i class="bi bi-arrow-left"></i> Quay lại danh sách
        </a>

        <!-- FORM HEADER -->
        <div class="form-header">
            <h2 th:if="${student.id == null}">
                <i class="bi bi-person-plus"></i> Thêm Sinh viên
            </h2>
            <h2 th:if="${student.id != null}">
                <i class="bi bi-pencil-square"></i> Cập nhật Sinh viên
            </h2>
            <p th:if="${student.id == null}">Nhập thông tin sinh viên mới</p>
            <p th:if="${student.id != null}">Chỉnh sửa thông tin sinh viên</p>
        </div>

        <!-- ERROR MESSAGE -->
        <div class="alert alert-danger" th:if="${error}">
            <i class="bi bi-exclamation-circle"></i>
            <strong>Lỗi:</strong> <span th:text="${error}"></span>
        </div>

        <!-- FORM -->
        <form th:action="@{/students/save}" method="post" th:object="${student}">

            <!-- ID ẩn (update) -->
            <input type="hidden" th:field="*{id}">

            <!-- HỌ TÊN -->
            <div class="form-group">
                <label class="form-label">
                    <i class="bi bi-person"></i> Họ và Tên
                </label>
                <input type="text"
                       class="form-control"
                       th:field="*{name}"
                       placeholder="Nhập họ và tên đầy đủ"
                       required
                       minlength="2"
                       maxlength="100">
                <div class="form-hint">Độ dài tối thiểu 2 ký tự</div>
            </div>

            <!-- TUỔI -->
            <div class="form-group">
                <label class="form-label">
                    <i class="bi bi-calendar"></i> Tuổi
                </label>
                <input type="number"
                       class="form-control"
                       th:field="*{age}"
                       placeholder="Nhập tuổi"
                       min="16" max="120"
                       required>
                <div class="form-hint">Tuổi từ 16 đến 120</div>
            </div>

            <!-- GIỚI TÍNH -->
            <div class="form-group">
                <label class="form-label">
                    <i class="bi bi-gender-ambiguous"></i> Giới tính
                </label>
                <select class="form-select" th:field="*{gender}" required>
                    <option value="">-- Chọn giới tính --</option>
                    <option value="Nam">👨 Nam</option>
                    <option value="Nữ">👩 Nữ</option>
                </select>
            </div>

            <!-- EMAIL -->
            <div class="form-group">
                <label class="form-label">
                    <i class="bi bi-envelope"></i> Email
                </label>
                <input type="email"
                       class="form-control"
                       th:field="*{email}"
                       placeholder="Nhập địa chỉ email"
                       required
                       maxlength="100">
                <div class="form-hint">Nhập email hợp lệ (ví dụ: user@example.com)</div>
            </div>

            <!-- FORM ACTIONS -->
            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    <i class="bi bi-check-circle"></i>
                    <span th:if="${student.id == null}">Thêm Sinh viên</span>
                    <span th:if="${student.id != null}">Cập nhật</span>
                </button>
                <a th:href="@{/students}" class="btn-cancel">
                    <i class="bi bi-x-circle"></i> Hủy
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
